name: Проверка сайта
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Структура, ссылки, alt, JSON-LD, sitemap
        run: node scripts/check.mjs
